server:
  port: ${APP_PORT:8080}

spring:
  profiles:
    active: local
  ai:
    mcp:
      server:
        enabled: true
        name: confluence-mcp-server
        version: 0.1.0
        type: SYNC
        protocol: STREAMABLE
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        annotation-scanner:
          enabled: true
        streamable-http:
          mcp-endpoint: ${MCP_ENDPOINT:/mcp}

confluence:
  base-url: ${CONFLUENCE_BASE_URL:https://confluence.company.ru}
  token: ${CONFLUENCE_TOKEN:}
  connect-timeout: 5s
  read-timeout: 30s
  read:
    default-max-chars: 20000
    max-chars: 50000
  write:
    parent-page-id: ${CONFLUENCE_PARENT_PAGE_ID:}
    max-content-size: 1MB
